name: reproducibility-smoke-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Repository integrity
        run: python scripts/validate_repository.py
      - name: Unit tests
        run: pytest -q
      - name: Reproduction smoke run
        run: python scripts/run_model.py --trials 20 --output ci_outputs
