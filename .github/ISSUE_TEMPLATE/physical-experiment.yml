name: Physical replication result
description: Report a physical ACS experiment, including negative results
title: "[EXPERIMENT] "
labels: ["experiment"]
body:
  - type: input
    id: specimen
    attributes:
      label: Specimen / protocol version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Outcome
      options: ["Passes preregistered gate", "Fails preregistered gate", "Inconclusive"]
    validations:
      required: true
  - type: textarea
    id: methods
    attributes:
      label: Methods and controls
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Raw-data location and calibration files
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Deviations from protocol / failed runs
