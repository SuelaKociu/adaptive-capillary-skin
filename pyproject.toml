[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-capillary-skin"
version = "0.1.0"
description = "Computational falsification model for the Adaptive Capillary Skin concept"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Suela Kociu"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
